on:
  workflow_call:
    inputs:
      region:
        type: string
        required: false
        default: "us-east-1"
      run_slow:
        required: false
        type: string
        default: "True"
      test_path:
        type: string
        required: true
      test_parallelism:
        type: string
        required: false
        default: "4"
      build_img_cmd:
        type: string
        required: false
        default: "make inference-pytorch-gpu"
      log_level:
        type: string
        required: false
        default: "ERROR"
      log_format:
        type: string
        required: false
        default: "%(asctime)s %(levelname)s %(module)s:%(lineno)d %(message)s"
      runs_on:
        type: string
        required: false
        default: 'aws-g4dn-2xlarge-cache'

jobs:
  pytorch-integration-tests:
    runs-on:
      group: ${{ inputs.runs_on }}
    env:
      AWS_REGION: ${{ inputs.region }}
      # Keep the model cache inside the job's own workspace, so a run never depends on state
      # shared with anything else. Models are re-downloaded every run; the integ test fixtures
      # are tiny on purpose. It has to be the workspace rather than somewhere under $HOME
      # because conftest bind-mounts the downloaded model dir into the test container, so the
      # docker daemon has to be able to resolve the path as well.
      HF_HOME: ${{ github.workspace }}/.hf_cache
      HF_HUB_CACHE: ${{ github.workspace }}/.hf_cache/hub
      RUN_SLOW: ${{ inputs.run_slow }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226  # v3.0.0
    - name: Docker Build
      run: ${{ inputs.build_img_cmd }}
    - name: Set up Python 3.11
      uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e  # v2
      with:
        python-version: 3.11
    - name: Install dependencies
      run: pip install ".[torch, test]"
    - name: Run local integration tests
      run: |
        python -m pytest \
        ${{ inputs.test_path }} -n ${{ inputs.test_parallelism }} \
        --log-cli-level='${{ inputs.log_level }}' \
        --log-format='${{ inputs.log_format }}'
