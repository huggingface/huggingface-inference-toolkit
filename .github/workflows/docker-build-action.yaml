on:
  workflow_call:
    inputs:
      context:
        type: string
        required: false
        default: "./"
      repository:
        type: string
        required: false
        default: "registry.internal.huggingface.tech/hf-endpoints"
      image:
        type: string
        required: true
      build_args:
        type: string
        required: false
        default: ""
      dockerfile:
        type: string
        required: false
        default: "Dockerfile"
      # Which Dockerfile stage to publish. Defaults to the single-stage name Dockerfile.inf2 still
      # uses; the multi-stage pytorch Dockerfile has to ask for "runtime" explicitly.
      target:
        type: string
        required: false
        default: "base"
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true

jobs:
  buildx:
    runs-on:
      group: aws-highmemory-32-plus-priv
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
        with:
          install: true

      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ inputs.repository }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Inject slug/short variables
        uses: rlespinasse/github-slug-action@0e3299190dac9a700da92a90de4556116ea965ed  # v5.7.1

      - name: Build and push image to container registry
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          push: true
          context: ${{ inputs.context }}
          build-args: ${{ inputs.build_args }}
          target: ${{ inputs.target }}
          outputs: type=image,compression=zstd,force-compression=true,push=true
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          tags: ${{ inputs.repository }}/${{ inputs.image }}:sha-${{ env.GITHUB_SHA_SHORT }},${{ inputs.repository }}/${{ inputs.image }}:latest
