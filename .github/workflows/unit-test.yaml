name: Run Unit-Tests

on:
  push:
    paths-ignore:
      - 'README.md'
    branches:
     - main
  pull_request:
  workflow_dispatch:

env:
  ACTIONS_RUNNER_DEBUG: true
  ACTIONS_STEP_DEBUG: true

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pytorch-unit-test:
    runs-on: 
      group: aws-g4dn-2xlarge-cache
    env:
      AWS_REGION: us-east-1
      # Only ever used as a bind-mount target inside the test container, so it does not need
      # to point anywhere outside the job.
      CACHE_TEST_DIR: /opt/hf-inference-toolkit-tests
      RUN_SLOW: True
    steps:
    - uses: actions/checkout@v4.1.1
    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3.0.0
    - name: Docker Build
      run: make inference-pytorch-gpu
    - name: Run unit tests
      run: |
        docker run \
          -e RUN_SLOW='${{ env.RUN_SLOW }}' \
          --gpus all \
          -e CACHE_TEST_DIR='${{ env.CACHE_TEST_DIR }}' \
          -v ./tests:${{ env.CACHE_TEST_DIR }} \
          --entrypoint /bin/bash \
          integration-test-pytorch:gpu \
          -c "pip install '.[test,st,diffusers,google]' && pytest ${{ env.CACHE_TEST_DIR }}/unit"
